name: gitlab-stack

services:
  gitlab-runner:
    image: ${GITLAB_RUNNER_IMAGE}
    container_name: gitlab-runner
    restart: unless-stopped

    volumes:
      - ./config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
