
services:
  gitlab:
    image: ${GITLAB_IMAGE}
    container_name: gitlab
    restart: unless-stopped
    hostname: gitlab

    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${GITLAB_HOST}'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 5

        registry_external_url 'http://172.18.99.71:5050'
        gitlab_rails['registry_enabled'] = true
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false

        # Mailpit SMTP configuration
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = 'mailpit'
        gitlab_rails['smtp_port'] = 1025
        gitlab_rails['smtp_domain'] = 'behsacorp.com'
        gitlab_rails['smtp_authentication'] = nil
        gitlab_rails['smtp_enable_starttls_auto'] = false

        gitlab_rails['gitlab_email_from'] = 'gitlab@behsacorp.com'
        gitlab_rails['gitlab_email_reply_to'] = 'gitlab@behsacorp.com'

    ports:
      - "${GITLAB_HTTP_PORT}:80"
      - "${GITLAB_SSH_PORT}:22"
      - "5050:5050"

    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - ./data:/var/opt/gitlab

    shm_size: "256m"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

